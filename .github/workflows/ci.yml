# The template's own CI: generate projects and run their checks.
#
# Testing every combination of options would be 2 × 2 × 2 × 4 = 32 projects. Instead the matrix
# below covers every value of every option at least once, plus the combinations with their own
# code paths (Vercel with a database). Each job generates a project with
# scripts/check-combination.sh, which runs the project's own `make setup` and `make check`:
# formatting, lint, types, pytest against PostgreSQL (docker compose), Vitest, build, Playwright.
#
# When you add an option or a value, add it to at least one row and keep the table in the README.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Every Monday: a generated project installs the newest releases that are a week old, so a new
  # release of a dependency can break new projects without any commit here.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  combination:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: defaults (render, pyright, visor, database)
            data: ""
          # A mid-length name: lines just over 100 characters that fit once wrapped are the ones
          # ruff format rewrites. The name-lengths job below checks every length with ruff alone.
          # Also sign-in (auth=sessions) on a long-running server.
          - name: railway + ty, mid-length name
            data: >-
              --data api_deploy=railway --data type_checker=ty --data auth=sessions
              --data "project_name=Medium Name Check"
          # The longest name copier.yml accepts: a 58-character package, whose test database
          # (`<package>_test`) is exactly PostgreSQL's 63-byte limit.
          # Also sign-in through an OIDC provider, with a database.
          - name: fastapi_cloud, API only, longest name
            data: >-
              --data api_deploy=fastapi_cloud --data with_frontend=false --data auth=oidc
              --data "project_name=Very Long Project Name For Formatting Checks Up To The Cap"
          # Also OIDC sign-in without a database (the user comes from the claims alone).
          - name: vercel + ty, no database
            data: >-
              --data api_deploy=vercel --data type_checker=ty --data with_database=false
              --data auth=oidc
          # Also a long description: it lands in the visor's index.html, which oxfmt formats, and
          # in Python strings; and sign-in on serverless functions. (The name is a required check
          # on main: keep it.)
          - name: vercel with database
            data: >-
              --data api_deploy=vercel --data postgres_port=5544 --data auth=sessions
              --data "description=A long one-sentence description that keeps going well past
              the width at which oxfmt would wrap an HTML line."
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Copier
        run: uv tool install "copier==9.19.1"
      - name: Generate and check
        run: scripts/check-combination.sh "$RUNNER_TEMP/project" ${{ matrix.data }}

  # The names end up in Python lines, and ruff format rewraps some of them only for a band of
  # name lengths: this job generates the backend for every package-name length and runs ruff.
  name-lengths:
    name: every name length passes ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - name: Copier
        run: uv tool install "copier==9.19.1"
      - name: Generate every package-name length, run ruff
        run: scripts/check-name-lengths.sh "$RUNNER_TEMP/lengths"

  # The workflows of this repository. Each generated project checks its own with `make check`.
  zizmor:
    name: workflows pass zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: zizmor
        run: uvx zizmor@1.32.0 --offline --no-progress .github

  update:
    name: copier update applies cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Copier
        run: uv tool install "copier==9.19.1"
      - name: Generate, change the template, update
        run: scripts/check-update.sh "$RUNNER_TEMP/update"
